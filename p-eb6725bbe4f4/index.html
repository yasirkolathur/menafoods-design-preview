<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A6B4F">
<title>MENAFoods · Design preview</title>
<style>
@font-face{font-family:Readex;src:url(redesign-v3/assets/fonts/ReadexPro-Var.ttf) format("truetype");font-weight:200 700;font-display:swap}
@font-face{font-family:PlexAr;src:url(redesign-v3/assets/fonts/IBMPlexSansArabic-Regular.ttf);font-weight:400;font-display:swap}
@font-face{font-family:PlexAr;src:url(redesign-v3/assets/fonts/IBMPlexSansArabic-SemiBold.ttf);font-weight:600;font-display:swap}
@font-face{font-family:PlexAr;src:url(redesign-v3/assets/fonts/IBMPlexSansArabic-Bold.ttf);font-weight:700;font-display:swap}
@font-face{font-family:InterV;src:url(redesign-v3/assets/fonts/Inter-Var.ttf) format("truetype");font-weight:100 900;font-display:swap}
:root{--bg:#F6F5F1;--card:#fff;--ink:#16201B;--mut:#5A665F;--line:#E4E2DA;--brand:#0A6B4F;--brand2:#E6F2EC;--saf:#B9741A;--safbg:#FBF0DF;--warn:#7A4B00;--warnbg:#FFF4D6;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0C100E;--card:#151B18;--ink:#EEF2EF;--mut:#A3B0A8;--line:#26302B;--brand:#3DBE8C;--brand2:#14291F;--saf:#F0B35A;--safbg:#2A2010;--warn:#F5D58A;--warnbg:#2A2410}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:InterV,PlexAr,system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
[dir=rtl] body{font-family:PlexAr,InterV,system-ui,sans-serif}
.num{font-family:InterV,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.banner{background:var(--warnbg);color:var(--warn);text-align:center;font-size:13px;font-weight:600;padding:8px 16px}
header{max-width:1180px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--brand);display:grid;place-items:center;color:#fff;font-family:Readex;font-weight:700;font-size:20px;flex:none}
h1{font-family:Readex,PlexAr,sans-serif;font-weight:600;font-size:clamp(24px,4vw,34px);line-height:1.2;margin:0}
.sub{color:var(--mut);margin:6px 0 0;font-size:15px;max-width:640px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card);flex:none}
.lang button{all:unset;cursor:pointer;min-height:44px;min-width:52px;padding:0 14px;display:grid;place-items:center;font-weight:600;font-size:14px;color:var(--mut)}
.lang button[aria-pressed=true]{background:var(--brand);color:#fff}
.lang button:focus-visible,.card:focus-visible,.chip:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding:12px 20px 48px}
.section{font-family:Readex,PlexAr,sans-serif;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:28px 0 12px;font-weight:600}
[dir=rtl] .section{letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .16s,box-shadow .16s,border-color .16s}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.08);border-color:var(--brand)}
.card.rec{border:2px solid var(--brand)}
.thumb{aspect-ratio:4/3;background:var(--brand2);overflow:hidden;display:flex;justify-content:center}
.thumb img{width:72%;height:auto;object-fit:cover;object-position:top;margin-top:16px;border-radius:14px 14px 0 0;box-shadow:0 4px 24px rgba(0,0,0,.12)}
.body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2{font-family:Readex,PlexAr,sans-serif;font-size:18px;font-weight:600;margin:0;line-height:1.3}
.desc{color:var(--mut);font-size:14px;margin:0}
.meta{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut)}
.open{color:var(--brand);font-weight:600}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--brand);color:#fff}
.badge.saf{background:var(--safbg);color:var(--saf)}
.badge.mut{background:transparent;color:var(--mut);border:1px solid var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{position:relative;z-index:2;font-size:13px;font-weight:600;color:var(--brand);border:1px solid var(--line);border-radius:999px;padding:0 12px;min-height:36px;display:inline-flex;align-items:center;text-decoration:none;background:var(--card)}
.stretch::after{content:"";position:absolute;inset:0}
.live{background:var(--brand);color:#fff;display:inline-flex;align-items:center;gap:6px}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:#7CF0B8;box-shadow:0 0 0 3px rgba(124,240,184,.35)}
.acts{position:relative;z-index:2;display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.bp{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;font-size:15px;text-decoration:none}
.bs{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);color:var(--brand);font-weight:600;font-size:14px;text-decoration:none;background:var(--card)}
.bp:focus-visible,.bs:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (prefers-color-scheme:dark){.bp,.live{color:#0C100E}}
.try{position:relative;z-index:2;margin:8px 0 0;padding:10px 12px;border-radius:12px;background:var(--brand2);font-size:13.5px}
.try b{display:block;font-size:13px;margin-bottom:4px}
.try ol{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:3px}
.lim{font-size:13px;color:var(--mut);margin:4px 0 0;padding:8px 10px;border-inline-start:3px solid var(--line)}
footer{max-width:1180px;margin:0 auto;padding:0 20px 40px;color:var(--mut);font-size:13px}
@media (max-width:560px){header{flex-direction:column}.lang{align-self:stretch}.lang button{flex:1}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="banner" data-t="banner"></div>
<header>
  <div>
    <div class="brand"><div class="logo">M</div><h1 data-t="title"></h1></div>
    <p class="sub" data-t="sub"></p>
  </div>
  <div class="lang" role="group" aria-label="Language / اللغة">
    <button type="button" data-l="ar" lang="ar">العربية</button>
    <button type="button" data-l="en" lang="en">English</button>
  </div>
</header>
<main>
  <div class="section" data-t="latest"></div>
  <div class="grid" id="g1"></div>
  <div class="section" data-t="newthemes"></div>
  <div class="grid" id="g4"></div>
  <div class="section" data-t="phases"></div>
  <div class="grid" id="g2"></div>
  <div class="section" data-t="earlier"></div>
  <div class="grid" id="g3"></div>
</main>
<footer data-t="foot"></footer>
<script>
const T={
 banner:["Design preview · sample data only · not the live MENAFoods app","معاينة تصميم · بيانات تجريبية فقط · ليس تطبيق مينا فودز الفعلي"],
 title:["MENAFoods design themes","ثيمات تصميم مينا فودز"],
 sub:["The 4 full builds are now working previews: sign in with a sample account, place orders, raise requests and redeem points — saved on your device, sample data only. Pick a theme to open it. Inside each one you can switch role, language, light or dark, phone or tablet, and PWA, Android or iOS.","البُنى الأربع الكاملة أصبحت نسخًا تجريبية تعمل: ادخل بحساب تجريبي واطلب وارفع الطلبات واستبدل النقاط — تُحفظ على جهازك وبيانات تجريبية فقط. اختر ثيمًا لفتحه. داخل كل ثيم يمكنك تغيير الدور واللغة والوضع الفاتح أو الداكن والجوال أو الجهاز اللوحي وPWA أو أندرويد أو iOS."],
 latest:["Approved direction","الاتجاه المعتمد"],
 phases:["Phase prototypes","نماذج المراحل"],
 newthemes:["New visual themes · full app","ثيمات بصرية جديدة · التطبيق كاملًا"], nw:["New","جديد"], dark1:["Dark-first","داكن أولًا"],
 earlier:["Earlier directions","الاتجاهات السابقة"],
 screens:["screens","شاشة"], open:["Open →","← افتح"],
 live:["Working preview","نسخة تجريبية تعمل"], openApp:["Open app","افتح التطبيق"], studio:["Design studio","استوديو التصميم"], care:["Customer care","خدمة العملاء"], tryT:["Try this","جرّب هذا"], clickable:["Clickable · actions simulated","قابل للنقر · الإجراءات محاكاة"],
 tryS:[["Tap “Owner” on the sign-in screen, add 3 items and place the order — watch its status move (or tap “Advance status”).","اضغط «المالك» في شاشة الدخول، أضف 3 أصناف وأتمّ الطلب — تابع تغيّر حالته (أو اضغط «تقديم الحالة»)."],["On the order, tap “Report a problem” — it appears in My requests with a timeline.","من الطلب اضغط «الإبلاغ عن مشكلة» — يظهر في طلباتي مع خط زمني."],["Rewards → redeem Free delivery for 500 points, then copy your referral link.","المكافآت ← استبدل التوصيل المجاني بـ 500 نقطة، ثم انسخ رابط الإحالة."],["Account → switch to Accountant → Invoice disputes → decide C-2294. Or try Salesperson → Customer 360.","الحساب ← بدّل إلى المحاسب ← اعتراضات الفواتير ← قرّر في C-2294. أو جرّب المندوب ← عرض العميل 360."]],
 limOld:["Every link and button responds. Data isn’t saved and actions like Pay or Submit are simulated (you’ll see a note). For the fully working app, use the Working preview themes.","كل رابط وزر يستجيب. البيانات لا تُحفظ والإجراءات مثل الدفع أو الإرسال محاكاة (ستظهر ملاحظة). للتطبيق العامل بالكامل استخدم ثيمات النسخة التجريبية التي تعمل."],
 rec:["Recommended","موصى به"], approved:["Approved","معتمد"], older:["Superseded","سابق"], p1:["Phase 1","المرحلة 1"], p2:["Phase 2","المرحلة 2"],
 foot:["For review only. All businesses, prices, stock and amounts are fictional. No live systems are connected.","للمراجعة فقط. جميع الأنشطة والأسعار والمخزون والمبالغ وهمية. لا يوجد اتصال بأي نظام فعلي."]
};
const THEMES=[
 {g:4,live:1,id:"theme-souq-modern",href:"theme-souq-modern/index.html",n:193,badges:["nw"],
  name:["Souq Modern","السوق العصري"],
  d:["Warm Saudi heritage: terracotta and sand, Sadu-weave bands, 8-point star lattice, arch shapes and Reem Kufi headings.","تراث سعودي دافئ: الطين والرمل، وشرائط السدو، ونقش النجمة الثمانية، والأقواس، وعناوين بخط ريم كوفي."],
  chips:[["theme-souq-modern/app.html",["App only, full screen","التطبيق فقط بملء الشاشة"]],["theme-souq-modern/app.html#/cc.home",["New: Customer care","جديد: خدمة العملاء"]]]},
 {g:4,live:1,id:"theme-pro-ops",href:"theme-pro-ops/index.html",n:193,badges:["nw","dark1"],
  name:["Pro Ops","العمليات الاحترافية"],
  d:["Dark-first console for power users: dense rows, monospaced numbers, KPI grids, live sync strip and 3-column tablet.","واجهة تشغيل داكنة للمستخدمين المحترفين: صفوف كثيفة وأرقام أحادية المسافة وشبكات مؤشرات وشريط مزامنة و3 أعمدة على الجهاز اللوحي."],
  chips:[["theme-pro-ops/app.html",["App only, full screen","التطبيق فقط بملء الشاشة"]],["theme-pro-ops/app.html#/cc.home",["New: Customer care","جديد: خدمة العملاء"]]]},
 {g:4,live:1,id:"theme-fresh-market",href:"theme-fresh-market/index.html",n:193,badges:["nw"],
  name:["Fresh Market","السوق الطازج"],
  d:["Bright and photography-led: real product photos, leaf green with tomato and lemon, pillowy cards and a floating pill nav.","مشرق ويعتمد على الصور: صور منتجات حقيقية، وأخضر ورقي مع الطماطم والليمون، وبطاقات ناعمة وشريط تنقل عائم."],
  chips:[["theme-fresh-market/app.html",["App only, full screen","التطبيق فقط بملء الشاشة"]],["theme-fresh-market/app.html#/cc.home",["New: Customer care","جديد: خدمة العملاء"]]]},
 {g:1,live:1,id:"redesign-v3",href:"redesign-v3/index.html",n:193,badges:["rec","approved"],rec:1,
  name:["Calm Commerce · v3 (full app)","التجارة الهادئة · الإصدار 3 (التطبيق كاملًا)"],
  d:["The approved redesign of the whole app: ordering, credit, rewards, Business Hub and every staff role.","إعادة التصميم المعتمدة للتطبيق كاملًا: الطلب والائتمان والمكافآت ومركز الأعمال وكل أدوار الموظفين."],
  chips:[["redesign-v3/app.html",["App only, full screen","التطبيق فقط بملء الشاشة"]],["redesign-v3/app.html#/cc.home",["New: Customer care","جديد: خدمة العملاء"]]]},
 {g:1,id:"v3-concepts",href:"redesign-v3/concepts/index.html#s=home",n:3,badges:["older"],
  name:["Calm Commerce · first concept","التجارة الهادئة · المفهوم الأول"],
  d:["The first Calm Commerce sketch: home, cart and customer 360.","المسودة الأولى للتجارة الهادئة: الرئيسية والسلة وعرض العميل 360."],
  chips:[["redesign-v3/concepts/index.html#s=cart",["Cart","السلة"]],["redesign-v3/concepts/index.html#s=c360",["Customer 360","عرض العميل 360"]]]},
 {g:2,id:"rewards-earn",href:"rewards-earn/index.html",n:43,badges:["p1"],
  name:["Rewards & Earn","المكافآت والربح"],
  d:["Loyalty points, rewards, referrals and affiliate earning, plus sponsored brand deals.","نقاط الولاء والمكافآت والإحالات وأرباح الشركاء وعروض العلامات الممولة."]},
 {g:2,id:"business-hub",href:"business-hub/index.html",n:33,badges:["p2"],
  name:["Business Hub · mini ERP","مركز الأعمال · نظام ERP مصغر"],
  d:["Purchases, daily sales, expenses, cash day book, payments and team, connected to Zoho Books.","المشتريات والمبيعات اليومية والمصروفات ودفتر الصندوق والمدفوعات والفريق، مرتبط بـ Zoho Books."]},
 {g:3,id:"direction-a-v2",href:"direction-a-v2/index.html",n:92,badges:["older"],
  name:["Direction A v2 · Reorder-first","الاتجاه A الإصدار 2 · إعادة الطلب أولًا"],
  d:["Reorder-first app with smart basket, credit, cash book and growth hub.","تطبيق يبدأ بإعادة الطلب مع سلة ذكية وائتمان ودفتر صندوق ومركز نمو."]},
 {g:3,id:"direction-a",href:"direction-a/index.html",n:55,badges:["older"],
  name:["Direction A · Quiet Pro","الاتجاه A · احترافي هادئ"],
  d:["The first reorder-first concept for buyers, sales and operations.","أول مفهوم لإعادة الطلب أولًا للمشترين والمبيعات والعمليات."]},
 {g:3,id:"direction-b",href:"direction-b/index.html",n:59,badges:["older"],
  name:["Direction B · Smart Basket","الاتجاه B · السلة الذكية"],
  d:["A guided assistant that builds the basket and walks through credit.","مساعد موجّه يجهّز السلة ويرشد خطوات الائتمان."]},
 {g:3,id:"direction-c",href:"direction-c/index.html",n:60,badges:["older"],
  name:["Direction C · Role Command Hubs","الاتجاه C · لوحات قيادة حسب الدور"],
  d:["A command hub for each role: buyer, sales, van, driver, store and accounts.","لوحة قيادة لكل دور: المشتري والمبيعات والمندوب والسائق والمستودع والحسابات."]}
];
let L=(()=>{try{const s=localStorage.getItem('mfp.lang');if(s)return s}catch(e){}return (navigator.language||'en').toLowerCase().startsWith('ar')?'ar':'en'})();
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function withLang(h){ // pass chosen language to prototypes
  if(h.includes('concepts/')) return h+(h.includes('#')?'&':'#')+'l='+L;
  if((h.startsWith('redesign-v3/')||h.startsWith('theme-'))&&h.includes('#')) return h+(h.includes('?')?'&':'?')+'lang='+L;
  if(h.startsWith('redesign-v3/')||h.startsWith('theme-')) return h+'#/b.home?lang='+L;
  return h;}
function render(){
  const i=L==='ar'?1:0; document.documentElement.lang=L; document.documentElement.dir=L==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T[e.dataset.t][i]);
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===L));
  document.title=T.title[i]+' · '+(i?'معاينة':'Preview');
  [1,4,2,3].forEach(g=>{document.getElementById('g'+g).innerHTML=THEMES.filter(t=>t.g===g).map(t=>`
   <article class="card${t.rec?' rec':''}">
    <div class="thumb"><img src="thumbs/${t.id}${i?"":"-en"}.webp" alt="" loading="lazy" width="480" height="600"></div>
    <div class="body">
     <div class="top">${t.live?`<span class="badge live">${T.live[i]}</span>`:t.g>1&&t.id!=='v3-concepts'?`<span class="badge mut">${T.clickable[i]}</span>`:''}${t.badges.map(b=>`<span class="badge ${b==='rec'||b==='nw'?'':b==='approved'||b.startsWith('p')?'saf':'mut'}">${T[b][i]}</span>`).join('')}</div>
     <h2><a class="stretch" href="${withLang(t.href)}" style="color:inherit;text-decoration:none">${esc(t.name[i])}</a></h2>
     <p class="desc">${esc(t.d[i])}</p>
     ${t.live?`<div class="acts"><a class="bp" href="${t.id}/app.html#/app.login?lang=${L}">${T.openApp[i]}</a><a class="bs" href="${withLang(t.href)}">${T.studio[i]}</a><a class="bs" href="${t.id}/app.html#/cc.home?lang=${L}">${T.care[i]}</a></div><div class="try"><b>${T.tryT[i]}</b><ol>${T.tryS.map(x=>`<li>${esc(x[i])}</li>`).join('')}</ol></div>`:''}
     ${!t.live&&t.g>1?`<p class="lim">${esc(T.limOld[i])}</p>`:''}
     ${t.chips&&!t.live?`<div class="chips">${t.chips.map(c=>`<a class="chip" href="${withLang(c[0])}">${esc(c[1][i])}</a>`).join('')}</div>`:''}
     <div class="meta"><span><span class="num">${t.n}</span> ${T.screens[i]}</span><span class="open">${T.open[i]}</span></div>
    </div></article>`).join('')});
}
document.querySelector('.lang').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;L=b.dataset.l;try{localStorage.setItem('mfp.lang',L)}catch(e){}render()});
render();
</script>
</body>
</html>
